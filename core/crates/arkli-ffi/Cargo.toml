[package]
name = "arkli-ffi"
version = "0.1.0"
edition = "2021"
description = "Arkli 的 UniFFI 桥接层：把 arkli-core 暴露给 Kotlin"

[lib]
# cdylib 供安卓加载，lib 供单测与 bindgen
name = "arkli_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
arkli-core = { path = "../arkli-core" }
# 识物：真实 ORT 后端（load-dynamic，运行时才找 libonnxruntime.so，宿主机编译不需要它）
arkli-ai = { path = "../arkli-ai", features = ["ort-backend"] }
uniffi = "0.32.2"
