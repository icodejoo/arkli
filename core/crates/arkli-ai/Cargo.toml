[package]
name = "arkli-ai"
version = "0.1.0"
edition = "2021"
description = "Arkli AI 运行时：推理后端抽象、provider 探测、PP-OCR 管线（纯逻辑 + 可选 MNN 后端）"

[features]
# 默认不带 MNN：宿主机单测全部走 mock 后端，不需要 MNN 动态库
default = []
# MNN 后端：运行时通过 libloading 动态加载 libarkli-mnn.so（C ABI 见 native/mnn/arkli_mnn_capi.h）；
# 翻译引擎（NLLB 的 MNN 三图实现）也在此 feature 下，所以同时带上翻译的依赖（分词、检测、清单解析）
mnn-backend = ["dep:libloading", "dep:tokenizers", "dep:serde", "dep:serde_json", "dep:whatlang"]

[dependencies]
# 本地翻译（translate 模块）：tokenizers 已获用户批准（只开 fancy-regex，不带 onig/进度条/HTTP）；
# serde/serde_json 用于 model.json 与 tokenizer.json 修补，均已是 tokenizers 的传递依赖。
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# 翻译源语言自动检测：whatlang 已获用户批准（纯 Rust、MIT、无模型文件；默认特性为空，不带 serde/enum-map/arbitrary）。
whatlang = { version = "0.18.0", default-features = false, optional = true }
# MNN 后端的动态加载：钉死版本避免 lock 漂移。
libloading = { version = "=0.9.0", optional = true }
